{{ if .Values.services.workspace.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-workspace
  labels:
    app: {{ .Release.Name }}-workspace
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-workspace
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-workspace
    spec:
      {{ include "pod.securityContext" . | indent 6 }}
      containers:
        - name: server
          {{ include "container.securityContext" . | indent 10 }}
          image: {{ .Values.services.workspace.image }}
          imagePullPolicy: {{ .Values.deployments.containers.pullPolicy }}
          command: ["/usr/sbin/sshd"]
          args: ["-D", "-e"]
          env:
            - name: CONTAINER_HOST
              value: unix:///run/podman.sock
            - name: SSH_AUTH_SOCK
              value: /run/sshd.sock
          volumeMounts:
            - name: sshd.sock
              mountPath: /run/sshd.sock
              readOnly: true
            - name: podman.sock
              mountPath: /run/podman.sock
            
            - name: {{ .Release.Name }}-workspace-workspace
              mountPath: /home/core

      volumes:
        - name: podman.sock
          hostPath:
            path: /run/user/1000/podman/podman.sock
            type: Socket
        - name: sshd.sock
          hostPath:
            path: /run/user/1000/gcr/ssh
            type: Socket
        - name: {{ .Release.Name }}-workspace-workspace
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-workspace-workspace
{{ end }}
